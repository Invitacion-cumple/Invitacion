<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Mis 3 años!</title>
    <!-- Fuentes infantiles y legibles -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="invitation-wrapper">

    <!-- TARJETA ÚNICA CON MARCO DE ACUARELA -->
    <section class="marco-acuarela-card">

        <!-- CAPA DE FONDO (.png) -->
        <img src="img/marco.png" alt="Marco Acuarela" class="img-fondo-marco">

        <!-- PRINCESA BLANCANIEVES DECORATIVA -->
        <img src="img/BlancaNieves.png" alt="Blancanieves" class="img-princesa-decorativa">

        <!-- PAJARITO AZUL DECORATIVO -->
        <img src="img/Decoracion.png" alt="Pajarito Azul" class="img-pajarito-decorativo">

        <!-- ZONA SEGURA: ESTRICTAMENTE EN EL CENTRO DEL ÓVALO BLANCO -->
        <div class="zona-segura-ovalo">

            <div class="contenido-libre">

                <!-- Encabezado de la Princesa -->
                <div class="header-texto">
                    <p class="pre-title">✨ ¡CELEBRA CON NOSOTROS LOS ✨</p>
                    <h1 class="title">3 Años</h1>
                    <p class="subtitle-princesa">de nuestra princesa</p>
                    <p class="name">Keyla Nicole!</p>
                </div>

                <!-- Detalles de Fecha y Lugar -->
                <div class="details-container">
                    <div class="detail-box">
                        <span class="detail-label">📅 ¿CUÁNDO?</span>
                        <p class="detail-main">22 de Agosto de 2026</p>
                        <p class="detail-sub">A partir de las 3:00 PM</p>
                    </div>

                    <div class="detail-divider"></div>

                    <div class="detail-box">
                        <span class="detail-label">📍 ¿DÓNDE?</span>
                        <p class="detail-main">Se llevará a cabo en</p>
                        <p class="detail-sub">Calle Calvario #28, Col. Atlacomulco</p>
                    </div>
                </div>

                <!-- Temporizador -->
                <div class="countdown-section">
                    <p class="countdown-title">🍎 FALTAN PARA LA FIESTA 🍎</p>
                    <div id="countdown" class="countdown-timer">
                        <div class="time-box"><span id="days">00</span><p>DÍAS</p></div>
                        <div class="time-box"><span id="hours">00</span><p>HRS</p></div>
                        <div class="time-box"><span id="minutes">00</span><p>MIN</p></div>
                        <div class="time-box"><span id="seconds">00</span><p>SEG</p></div>
                    </div>
                </div>

                <!-- Botón al Mapa -->
                <button class="btn-ubicacion">📍 VER UBICACIÓN</button>

            </div>

        </div>

    </section>

</main>

<script src="js/animacion.js"></script>
</body>
</html>
