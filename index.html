<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Mis 3 años y Bautizo!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎈</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://invitacion-cumple.github.io/Invitacion/">
    <meta property="og:title" content="🍎 ¡Mis 3 Años y Bautizo! | Keyla Nicole ✨">
    <meta property="og:description" content="👑 ¡Te esperamos para celebrar juntos este día tan especial! 👑 Sábado 22 de Agosto de 2026">
    <meta property="og:image" content="https://invitacion-cumple.github.io/Invitacion/img/preview.jpg">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="800">
</head>
<body>

<audio id="bg-audio" loop>
    <source src="audio/sonido.mp3" type="audio/mpeg">
</audio>

<main class="invitation-wrapper">
    <section class="marco-acuarela-card">
        <button id="audio-control" class="audio-btn">
            <svg id="icon-unmuted" style="display: none;" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="icon-muted" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>

        <img src="img/marco.png" alt="Marco Acuarela" class="img-fondo-marco">
        <img src="img/BlancaNieves.png" alt="Blancanieves" class="img-princesa-decorativa">
        <img src="img/Decoracion.png" alt="Pajarito Azul" class="img-pajarito-decorativo">

        <div class="zona-segura-ovalo">
            <div class="contenido-libre">

                <div class="header-texto">
                    <p class="pre-title">✨ ¡CELEBRA CON NOSOTROS EL BAUTIZO Y LOS ✨</p>
                    <h1 class="title">3 Años</h1>
                    <p class="subtitle-princesa">DE NUESTRA PRINCESA</p>
                    <p class="name">Keyla Nicole!</p>
                </div>

                <div class="date-header">
                    <p class="date-text">📅 22 de Agosto de 2026</p>
                </div>

                <div class="details-container">
                    <div class="detail-box">
                        <span class="detail-label">⛪ MISA • 12:00 PM</span>
                        <p class="detail-main">Iglesia "Resurrección de Jesús"</p>
                        <p class="detail-sub">Col. Atlacomulco</p>
                    </div>

                    <div class="detail-divider"></div>

                    <div class="detail-box">
                        <span class="detail-label">🎉 FIESTA • 3:00 PM</span>
                        <p class="detail-main">Calle Calvario #28</p>
                        <p class="detail-sub">Col. Atlacomulco</p>
                    </div>
                </div>

                <div class="countdown-section">
                    <p class="countdown-title">🍎 FALTAN 🍎</p>
                    <div id="countdown" class="countdown-timer">
                        <div class="time-box"><span id="days">00</span><p>DÍAS</p></div>
                        <div class="time-box"><span id="hours">00</span><p>HRS</p></div>
                        <div class="time-box"><span id="minutes">00</span><p>MIN</p></div>
                        <div class="time-box"><span id="seconds">00</span><p>SEG</p></div>
                    </div>
                </div>

                <div class="buttons-container">
                    <button class="btn-ubicacion btn-fiesta">🎉 VER UBICACIÓN DE LA FIESTA</button>
                </div>

            </div>
        </div>
    </section>
</main>

<script src="js/animacion.js"></script>
</body>
</html>
